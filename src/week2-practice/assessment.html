<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival Journey</title>
  <link rel="stylesheet" href="styles.css">
</head><h1>Film Assessment</h1>

<form id="filmForm">

  <label class="form-label">Film Title</label>
  <input type="text" id="filmTitle" required>

  <label class="form-label">Genre</label>
  <select id="genre">
    <option>Drama</option>
    <option>Documentary</option>
    <option>Comedy</option>
    <option>Animation</option>
    <option>Experimental</option>
  </select>

  <label class="form-label">Runtime</label>
  <input type="number" id="runtime">

  <label class="form-label">Has the film already screened publicly?</label>

  <select id="premiere">
    <option value="no">No</option>
    <option value="yes">Yes</option>
  </select>

  <label class="form-label">Do you have a press kit?</label>

  <select id="pressKit">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label class="form-label">Do you have a trailer?</label>

  <select id="trailer">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <button type="submit">
    Get My Festival Readiness Score
  </button>

</form>

<link rel="stylesheet" href="styles.css">
<script src="assessment.js"></script>
